name: Vídeo diario

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 07:00/08:00 en España
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar sin subir a YouTube"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y subir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/main.py --dry-run
          else
            python src/main.py
          fi

      - name: Guardar vídeo para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/video.mp4
            out/**/thumbnail.jpg
            out/**/meta.json
          retention-days: 7

      - name: Guardar historial de temas
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/history.json || true
          git diff --cached --quiet || (git commit -m "Historial de temas" && git push)
